name: EDTEAM FastAPI demo

on: 
  push: 
    branches: 
      - master
      - develop

jobs:
  ci: 
    runs-on: ubuntu-latest
    steps: 
      - name: checkout 
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/fastapi-demo:${{ github.sha }} .

      - name: Run unittest inside container
        run: |
          docker run --rm ${{ secrets.DOCKER_USERNAME }}/fastapi-demo:${{ github.sha }} python -m unittest discover -s test

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: docker push
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/fastapi-demo:${{ github.sha }}
