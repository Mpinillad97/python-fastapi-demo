name: EDTEAM FastAPI demo

on: 
  push: 
    branches: 
      - master
      - develop

jobs:
  ci: 
    runs-on: ubuntu-latest
    steps: 
      - name: checkout 
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -t fastapi-demo-ci .

      - name: Run unittest inside container
        run: |
          docker run --rm fastapi-demo-ci python -m unittest discover -s test
